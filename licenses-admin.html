<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Licencias</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1c3158,transparent 35%),#080b12;color:#eef4ff}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0}.login,.panel{border:1px solid rgba(133,174,255,.18);border-radius:8px;background:rgba(13,18,31,.96);box-shadow:0 18px 60px #0006}.login{width:min(380px,100%);margin:15vh auto 0;padding:24px;display:grid;gap:14px}h1{margin-top:0}input,button{min-height:40px;border:1px solid rgba(133,174,255,.18);border-radius:6px;background:#0b1020;color:#eef4ff;padding:0 12px}button{cursor:pointer;font-weight:700}.primary{background:#3978ed;border-color:#3978ed}.toolbar{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;padding:14px}.toolbar label{display:grid;gap:6px;color:#9cabca;font-size:11px}.panel{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ffffff12;text-align:left}td{font-size:13px}.actions{display:flex;gap:6px}.actions button{min-height:32px;font-size:11px}.danger{color:#ff91a6;border-color:#ff617e}.status{padding:4px 7px;border-radius:5px;color:#75ffb6}.status.banned{color:#ff91a6}.status.expired{color:#ffc976}[hidden]{display:none!important}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.actions{flex-direction:column}th:nth-child(3),td:nth-child(3){display:none}}
</style></head>
<body><main>
<section class="login" id="loginPanel"><h1>Licencias</h1><input id="adminPassword" type="password" placeholder="Contraseña"><button class="primary" id="enterAdmin">Entrar</button><small id="loginStatus"></small></section>
<section id="dashboard" hidden><header><h1>Licencias ilimitadas</h1><button id="logout">Salir</button></header><div class="panel toolbar"><label>Keys<input id="count" type="number" value="10" min="1" max="1000"></label><label>Días<input id="days" type="number" value="30" min="1" max="36500"></label><label>Dispositivos<input id="devices" type="number" value="1" min="1" max="10"></label><button class="primary" id="generate">Crear keys</button></div><textarea id="newKeys" rows="8" style="width:100%;display:none;margin-top:14px" readonly></textarea><div class="panel"><table><thead><tr><th>ID</th><th>Estado</th><th>Dispositivos</th><th>Vence</th><th>Acciones</th></tr></thead><tbody id="licenseRows"></tbody></table></div></section>
</main><script src="licenses-admin.js"></script></body></html>
